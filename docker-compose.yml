version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pfis_postgres
    restart: always
    environment:
      POSTGRES_USER: pfis_user
      POSTGRES_PASSWORD: pfis_password
      POSTGRES_DB: pfis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pfis_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://pfis_user:pfis_password@postgres:5432/pfis_db
      - SECRET_KEY=pfis_super_secret_production_key_2026
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pfis_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
